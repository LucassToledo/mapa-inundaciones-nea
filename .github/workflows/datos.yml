# Baja los datos (ríos, radar, alertas, prensa) dos veces por día y los sube si cambiaron
name: datos
on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -X utf8 web/actualizar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || (git commit -m "Datos al $(date -u +%F)" && git push)
